name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.19.0"
          cache: npm
      - name: Install
        run: npm ci
      - name: Validate release
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          test "$VERSION" = "$PACKAGE_VERSION"
          grep -F "## $VERSION -" CHANGELOG.md
          node scripts/foundation.mjs validate --strict
          npm test
          npm run typecheck
          npm run build
      - name: Validate PHP project in pinned Composer container
        env:
          FOUNDATION_PHP_CONTAINER: "1"
        run: |
          node scripts/foundation.mjs run install
          node scripts/foundation.mjs verify --scope project
      - name: Create release assets
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p .release
          git archive --format=tar.gz --prefix="project-foundation-v${VERSION}/" --output=".release/project-foundation-v${VERSION}.tar.gz" HEAD^{tree}
          cp .foundation/service-workflow.json .release/service-workflow.json
          cd .release
          sha256sum "project-foundation-v${VERSION}.tar.gz" > "project-foundation-v${VERSION}.tar.gz.sha256"
          sha256sum service-workflow.json > service-workflow.json.sha256
      - name: Validate current Release consumer install
        env:
          FOUNDATION_PHP_CONTAINER: "1"
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p .release/current-consumer
          tar -xzf ".release/project-foundation-v${VERSION}.tar.gz" -C .release/current-consumer
          cd ".release/current-consumer/project-foundation-v${VERSION}"
          node scripts/foundation.mjs init --runtime php --profile web,assets,typescript,scss,docker,github --project-name release-consumer --owner DevCrop
          node scripts/foundation.mjs run install
          node scripts/foundation.mjs verify --scope project
      - name: Validate previous immutable updater
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          CURRENT_MAJOR="${VERSION%%.*}"
          if ! PREVIOUS_TAG="$(gh release view --json tagName --jq .tagName 2>/dev/null)"; then
            echo "No previous Release; compatibility smoke test is not applicable."
            exit 0
          fi
          PREVIOUS_VERSION="${PREVIOUS_TAG#v}"
          PREVIOUS_MAJOR="${PREVIOUS_VERSION%%.*}"
          if [ "$CURRENT_MAJOR" != "$PREVIOUS_MAJOR" ]; then
            echo "Previous Release is a different major; automatic update is intentionally not applicable."
            exit 0
          fi
          gh release verify "$PREVIOUS_TAG"
          mkdir -p .release/previous
          gh release download "$PREVIOUS_TAG" --pattern "project-foundation-${PREVIOUS_TAG}.tar.gz" --dir .release/previous
          FOUNDATION_PREVIOUS_RELEASE_ARCHIVE=".release/previous/project-foundation-${PREVIOUS_TAG}.tar.gz" \
          FOUNDATION_CURRENT_RELEASE_ARCHIVE=".release/project-foundation-v${VERSION}.tar.gz" \
          FOUNDATION_CURRENT_RELEASE_VERSION="$VERSION" \
          node --test --test-name-pattern "immutable previous Release updater" scripts/foundation.test.mjs
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --draft --verify-tag --generate-notes
          gh release upload "$GITHUB_REF_NAME" \
            ".release/project-foundation-${GITHUB_REF_NAME}.tar.gz" \
            ".release/project-foundation-${GITHUB_REF_NAME}.tar.gz.sha256" \
            ".release/service-workflow.json" \
            ".release/service-workflow.json.sha256"
          gh release edit "$GITHUB_REF_NAME" --draft=false --verify-tag
