name: Quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: quality (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: ["22.23.2", "24.19.0"]
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install
        run: npm ci
      - name: Test
        run: npm test
      - name: Build
        if: ${{ hashFiles('tsconfig.json') != '' }}
        run: npm run build
      - name: Build styles
        if: ${{ hashFiles('styles/main.scss') != '' }}
        run: npm run styles:build
      - name: Strict validation
        run: node scripts/foundation.mjs validate --strict
      - name: Diff whitespace
        run: git diff --check

  container:
    name: container
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Setup Buildx
        if: ${{ hashFiles('Dockerfile') != '' }}
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - name: Dockerfile checks
        if: ${{ hashFiles('Dockerfile') != '' }}
        run: docker buildx build --check .
      - name: Compose validation
        if: ${{ hashFiles('compose.yaml') != '' }}
        run: docker compose config -q
      - name: Production image build
        if: ${{ hashFiles('Dockerfile') != '' }}
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          target: production
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
