name: Quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  foundation-policy:
    name: foundation-policy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Setup Foundation Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.19.0"
      - name: Verify policy and PR evidence
        run: node scripts/foundation.mjs verify --scope policy --base "origin/${{ github.base_ref || 'main' }}"

  project-quality:
    name: project-quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Foundation Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.19.0"
          cache: npm
      - name: Install asset dependencies
        run: npm ci
      - name: Run PHP install adapter in the pinned container
        env:
          FOUNDATION_PHP_CONTAINER: "1"
        run: node scripts/foundation.mjs run install --if-configured
      - name: Run configured project checks
        env:
          FOUNDATION_PHP_CONTAINER: "1"
        run: node scripts/foundation.mjs verify --scope project

  compatibility:
    name: compatibility (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: ["22.23.2", "24.19.0"]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install
        run: npm ci
      - name: Test CLI compatibility
        run: npm test

  php-compatibility:
    name: compatibility (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - php: "8.2.33"
            image: "php:8.2.33-fpm-bookworm@sha256:5623a1f394cfc9ec9710efc975db6d746618f1c3e047649232d5432a0b2f942c"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Test PHP compatibility in the pinned image
        run: docker buildx build --build-arg "PHP_IMAGE=${{ matrix.image }}" --target php-test --load --tag "project-foundation:php-${{ matrix.php }}" .

  container:
    name: container
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Foundation Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.19.0"
      - name: Setup Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Install Foundation test dependencies
        run: npm ci
      - name: Run Foundation CLI tests
        run: npm test
      - name: Verify configured container contract
        run: node scripts/foundation.mjs container verify
