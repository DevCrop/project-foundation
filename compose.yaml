name: ${COMPOSE_PROJECT_NAME:-project-foundation}

services:
  app:
    build:
      context: .
      target: development
    init: true
    environment:
      PORT: ${PORT:-3000}
    ports:
      - "${PORT:-3000}:${PORT:-3000}"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    develop:
      watch:
        - action: rebuild
          path: .
